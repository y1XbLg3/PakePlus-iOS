name: Build IPA

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Init Project Config
        run: |
          pnpm install --no-frozen-lockfile
          pnpm pp:worker

      - name: Show Build Environment
        run: |
          echo "macOS:"
          sw_vers
          echo "Xcode:"
          xcodebuild -version
          echo "Node:"
          node --version
          echo "pnpm:"
          pnpm --version

      - name: Generate AppIcon
        run: |
          echo "Installing appicon tool..."
          brew install Nonchalant/appicon/appicon
          echo "Generating AppIcon..."
          appicon app-icon.png \
            --output-path ./PakePlus/Assets.xcassets/AppIcon.appiconset

      - name: Build for Release
        run: |
          xcodebuild \
            -project PakePlus.xcodeproj \
            -scheme PakePlus \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -name "PakePlus.app" \
            -path "*Release-iphoneos*" \
            | head -n 1)"

          if [ -z "${APP_PATH}" ] || [ ! -d "${APP_PATH}" ]; then
            echo "::error::Could not find Release PakePlus.app"
            exit 1
          fi

          echo "APP_PATH=${APP_PATH}"

          NAME="${{ env.NAME }}"
          VERSION="${{ env.VERSION }}"
          ISHTML="${{ env.ISHTML }}"

          if [ -z "${NAME}" ]; then
            echo "::error::NAME is empty"
            exit 1
          fi

          if [ -z "${VERSION}" ]; then
            echo "::error::VERSION is empty"
            exit 1
          fi

          rm -rf Payload export
          mkdir -p Payload export

          cp -R "${APP_PATH}" Payload/

          if [ "${ISHTML:-false}" = "true" ]; then
            cp -R ./Scripts/www/. ./Payload/PakePlus.app/
          fi

          IPA_NAME="${NAME}-${VERSION}.ipa"

          zip -qry "${IPA_NAME}" Payload
          mv "${IPA_NAME}" "export/${IPA_NAME}"

          echo "Created export/${IPA_NAME}"
          ls -lh export/

      - name: Publish IPA
        uses: softprops/action-gh-release@v3
        with:
          files: export/${{ env.NAME }}-${{ env.VERSION }}.ipa
          tag_name: '${{ env.NAME }}'
          name: '${{ env.NAME }} v${{ env.VERSION }}'
          body: '${{ env.PUBBODY }}'
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
